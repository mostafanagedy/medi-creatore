version: '3.9'

services:
  # ──────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-content-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_content_os
      POSTGRES_USER: ai_content_os
      POSTGRES_PASSWORD: ai_content_os_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_content_os -d ai_content_os"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-content-os

  # ──────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-content-os-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-content-os

  # ──────────────────────────────────────────────
  # MinIO (S3-compatible local storage)
  # ──────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: ai-content-os-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ai-content-os

  # ──────────────────────────────────────────────
  # MinIO Bucket Setup
  # ──────────────────────────────────────────────
  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: ai-content-os-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing local/ai-content-os-media;
        mc anonymous set download local/ai-content-os-media/public;
        echo 'MinIO bucket created successfully';
      "
    networks:
      - ai-content-os

  # ──────────────────────────────────────────────
  # NestJS API
  # ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: ai-content-os-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://ai_content_os:ai_content_os_password@postgres:5432/ai_content_os
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ai-content-os-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: http://localhost:9000/ai-content-os-media
      JWT_SECRET: dev-jwt-secret-minimum-32-chars-change-in-production
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-minimum-32-chars-change-in-production
      ENCRYPTION_KEY: dev-encryption-key-32-bytes-xxxx
      FRONTEND_URL: http://localhost:3000
    env_file:
      - .env.local
    volumes:
      - ./apps/api/src:/app/apps/api/src:cached
      - ./packages:/app/packages:cached
    ports:
      - "3001:3001"
    networks:
      - ai-content-os

  # ──────────────────────────────────────────────
  # BullMQ Worker
  # ──────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: development
    container_name: ai-content-os-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ai_content_os:ai_content_os_password@postgres:5432/ai_content_os
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ai-content-os-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_FORCE_PATH_STYLE: "true"
    env_file:
      - .env.local
    volumes:
      - ./apps/worker/src:/app/apps/worker/src:cached
      - ./packages:/app/packages:cached
    networks:
      - ai-content-os

  # ──────────────────────────────────────────────
  # Next.js Frontend (optional — can run locally)
  # ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: ai-content-os-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    volumes:
      - ./apps/web:/app/apps/web:cached
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    ports:
      - "3000:3000"
    networks:
      - ai-content-os

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  ai-content-os:
    driver: bridge
